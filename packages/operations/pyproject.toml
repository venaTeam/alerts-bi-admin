[project]
name = "alerts-bi-operations"
version = "0.2.2"
description = "Alerts BI registry validation, operator actions and SQL-only reports"
requires-python = ">=3.12"
dependencies = [
    "alerts-bi-shared==0.1.5",
    "jsonschema>=4.23,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alerts_bi_operations"]

[tool.hatch.build.targets.sdist]
include = ["src", "pyproject.toml", "README.md"]
