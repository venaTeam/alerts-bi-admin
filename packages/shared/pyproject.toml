[project]
name = "alerts-bi-shared"
version = "0.1.6"
description = "Alerts BI common values, SQL connection, summaries and pure presentation"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0,<3",
    "pymssql>=2.4.3,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alerts_bi_shared"]

[tool.hatch.build.targets.sdist]
include = ["src", "pyproject.toml", "README.md"]
