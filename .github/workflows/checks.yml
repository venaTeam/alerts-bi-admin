name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install poetry==2.3.1
      - run: poetry sync --no-root
      - run: poetry run python -m ensurepip --upgrade
      - run: poetry run python -m pip install --no-deps -e .
      - run: poetry run ruff format --check .
      - run: poetry run ruff check .
      - run: poetry run mypy
      - run: poetry run pytest tests/unit tests/engine/unit
      - run: poetry build
      - run: poetry run python scripts/build_libraries.py
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: alertsbi-ci
      MSSQL_SA_PASSWORD: Alerts_bi_ci_Test_01!
      SQL_PASSWORD: Alerts_bi_ci_Test_01!
      SQL_HOST: localhost
      SQL_USER: sa
      SQL_DATABASE: alerts_bi_test
      SQL_TEST_DATABASE: alerts_bi_test
      ES_URL: http://localhost:9200
      LLM_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install poetry==2.3.1
      - run: poetry sync --no-root
      - run: poetry run python -m ensurepip --upgrade
      - run: poetry run python -m pip install --no-deps -e .
      - run: docker compose up -d --wait --wait-timeout 300 es sqlserver
      - name: Seed the fixed-clock local ES mock
        run: RESET=1 STATS_PATH="$RUNNER_TEMP/mock-stats.json" poetry run python scripts/generate_mock_alerts.py
      - name: Real SQL/ES job and critical acceptance regressions
        run: poetry run python scripts/ci_integration.py
      - name: Dependency logs on failure
        if: failure()
        run: docker compose logs --no-color es sqlserver
      - name: Remove disposable CI services
        if: always()
        run: docker compose down -v
