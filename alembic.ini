# Alembic configuration.
#
# `sqlalchemy.url` is deliberately absent: env.py builds it from the same environment
# configuration the application uses, so the connection is described in one place only.
# Which database to migrate comes from SQL_DATABASE, or from the caller.
#
# The application drives migrations through `alerts-bi db migrate`; this file exists so the
# `alembic` CLI works too, for history and heads.
[alembic]
script_location = %(here)s/src/engine/db/migrations
prepend_sys_path = %(here)s/src

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
