# OpenShift Template for the alerts-bi-admin operator console and its weekly scheduler.
#
# Do not edit values here. Fill a copy of values.env.example and render with:
#   oc process --local -f admin.yaml --param-file <values.env> --ignore-unknown-parameters -o yaml | oc apply -n <NAMESPACE> -f -
# The complete procedure, including the ConfigMaps and Secrets this Template reads but does
# not create, is in README.md next to this file.
#
# The console has no login (design "Admin console without login", 2026-10-19): anyone who can
# open its Route may use it, and nothing records who did what. One pod holds two containers
# plus a migration init container, all from ADMIN_IMAGE:
#   migrate (init)  applies missing SQL migrations before anything else starts
#   admin           the console on port 8200, the only port the Service exposes
#   run-worker      executes manual and backfill run submissions
# The CronJob runs `alerts-bi-admin weekly` from the same ADMIN_IMAGE.
apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: alerts-bi-admin
  annotations:
    description: Alerts BI operator console (UI and run worker, no login) and the single weekly scheduler.
objects:
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: alerts-bi-admin
      labels: {app: alerts-bi-admin, app.kubernetes.io/part-of: alerts-bi}

  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: alerts-bi-admin
      labels: {app: alerts-bi-admin, app.kubernetes.io/part-of: alerts-bi}
    spec:
      # Exactly one replica, replaced with Recreate: the old UI and worker stop before the new
      # pod's migration init container runs. Never scale up or switch to RollingUpdate.
      replicas: 1
      strategy: {type: Recreate}
      selector: {matchLabels: {app: alerts-bi-admin}}
      template:
        metadata:
          labels: {app: alerts-bi-admin, app.kubernetes.io/part-of: alerts-bi}
        spec:
          serviceAccountName: alerts-bi-admin
          # Nothing in the pod calls the OpenShift API.
          automountServiceAccountToken: false
          imagePullSecrets: [{name: "${IMAGE_PULL_SECRET}"}]
          securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
          initContainers:
            - name: migrate
              image: "${ADMIN_IMAGE}"
              # Idempotent. Creates SQL_DATABASE if absent, then applies only missing revisions.
              # No deadline on purpose: a long migration must never be cut short.
              command: ["/bin/sh", "-ec"]
              args:
                - 'exec alerts-bi-admin db setup --database "${ADMIN_DATABASE:-${SQL_DATABASE:-alerts_bi_dev}}"'
              envFrom:
                - configMapRef: {name: alerts-bi-config}
                - secretRef: {name: alerts-bi-secrets}
              resources:
                requests: {cpu: "${UI_CPU_REQUEST}", memory: "${UI_MEMORY_REQUEST}"}
                limits: {memory: "${UI_MEMORY_LIMIT}"}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL]}
          containers:
            - name: admin
              image: "${ADMIN_IMAGE}"
              command: ["alerts-bi-admin", "serve", "--registry", "/etc/alerts-bi/teams.json"]
              env:
                # The Service and Route reach the pod address; the console has no login.
                - {name: ADMIN_HOST, value: "0.0.0.0"}
                - {name: ADMIN_PORT, value: "8200"}
                - {name: ADMIN_REGISTRY_PATH, value: /etc/alerts-bi/teams.json}
                - name: ADMIN_SECRET
                  valueFrom: {secretKeyRef: {name: alerts-bi-admin-secrets, key: ADMIN_SECRET}}
              envFrom:
                - configMapRef: {name: alerts-bi-config}
                - secretRef: {name: alerts-bi-secrets}
              ports: [{containerPort: 8200, name: http}]
              volumeMounts:
                - {name: registry, mountPath: /etc/alerts-bi, readOnly: true}
                - {name: ca-bundle, mountPath: /etc/alerts-bi-ca, readOnly: true}
              # TCP probes on the listener only. /healthz also needs Elasticsearch, and an ES
              # outage must not take the publish/withdraw/decide pages offline. README.md checks it.
              readinessProbe:
                tcpSocket: {port: 8200}
                initialDelaySeconds: 5
                periodSeconds: 10
              livenessProbe:
                tcpSocket: {port: 8200}
                initialDelaySeconds: 30
                periodSeconds: 20
              resources:
                requests: {cpu: "${UI_CPU_REQUEST}", memory: "${UI_MEMORY_REQUEST}"}
                limits: {memory: "${UI_MEMORY_LIMIT}"}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL]}
            - name: run-worker
              image: "${ADMIN_IMAGE}"
              command: ["alerts-bi-admin", "run-worker", "--registry", "/etc/alerts-bi/teams.json"]
              env:
                - {name: ADMIN_REGISTRY_PATH, value: /etc/alerts-bi/teams.json}
              envFrom:
                - configMapRef: {name: alerts-bi-config}
                - secretRef: {name: alerts-bi-secrets}
              volumeMounts:
                - {name: registry, mountPath: /etc/alerts-bi, readOnly: true}
                - {name: ca-bundle, mountPath: /etc/alerts-bi-ca, readOnly: true}
              resources:
                requests: {cpu: "${ANALYSIS_CPU_REQUEST}", memory: "${WORKER_MEMORY_REQUEST}"}
                limits: {memory: "${WORKER_MEMORY_LIMIT}"}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL]}
          volumes:
            - {name: registry, configMap: {name: alerts-bi-registry}}
            # Optional private CA bundle for ES_CA_CERT / SSL_CERT_FILE; absent means an empty directory.
            - {name: ca-bundle, configMap: {name: alerts-bi-ca-bundle, optional: true}}

  - apiVersion: v1
    kind: Service
    metadata:
      name: alerts-bi-admin
      labels: {app: alerts-bi-admin, app.kubernetes.io/part-of: alerts-bi}
    spec:
      selector: {app: alerts-bi-admin}
      ports: [{name: http, port: 8200, targetPort: 8200}]

  - apiVersion: route.openshift.io/v1
    kind: Route
    metadata:
      name: alerts-bi-admin
      labels: {app: alerts-bi-admin, app.kubernetes.io/part-of: alerts-bi}
      annotations:
        haproxy.router.openshift.io/timeout: "${ADMIN_ROUTE_TIMEOUT}"
    spec:
      # Empty ADMIN_ROUTE_HOST lets OpenShift generate the host name. There is no client
      # allowlist: anyone who has the URL and can reach the router may use the console.
      host: "${ADMIN_ROUTE_HOST}"
      to: {kind: Service, name: alerts-bi-admin}
      port: {targetPort: http}
      tls: {termination: edge, insecureEdgeTerminationPolicy: Redirect}

  # The only weekly scheduler. Keep WEEKLY_SUSPEND=true until README.md "Enable the weekly
  # scheduler" says otherwise; never run a second scheduler for the same database.
  - apiVersion: batch/v1
    kind: CronJob
    metadata:
      name: alerts-bi-weekly
      labels: {app: alerts-bi-weekly, app.kubernetes.io/part-of: alerts-bi}
    spec:
      suspend: "${{WEEKLY_SUSPEND}}"
      schedule: "${WEEKLY_SCHEDULE}"
      timeZone: Etc/UTC
      concurrencyPolicy: Forbid
      startingDeadlineSeconds: 3600
      successfulJobsHistoryLimit: 3
      failedJobsHistoryLimit: 10
      jobTemplate:
        metadata:
          labels: {app: alerts-bi-weekly, app.kubernetes.io/part-of: alerts-bi}
        spec:
          # A failed or held week fails the Job; it is never retried automatically.
          backoffLimit: 0
          activeDeadlineSeconds: 43200
          template:
            metadata:
              labels: {app: alerts-bi-weekly, app.kubernetes.io/part-of: alerts-bi}
            spec:
              restartPolicy: Never
              serviceAccountName: alerts-bi-admin
              automountServiceAccountToken: false
              imagePullSecrets: [{name: "${IMAGE_PULL_SECRET}"}]
              securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
              containers:
                - name: weekly
                  image: "${ADMIN_IMAGE}"
                  command: ["alerts-bi-admin", "weekly", "--registry", "/etc/alerts-bi/teams.json"]
                  env:
                    - {name: ADMIN_REGISTRY_PATH, value: /etc/alerts-bi/teams.json}
                  envFrom:
                    - configMapRef: {name: alerts-bi-config}
                    - secretRef: {name: alerts-bi-secrets}
                  volumeMounts:
                    - {name: registry, mountPath: /etc/alerts-bi, readOnly: true}
                    - {name: ca-bundle, mountPath: /etc/alerts-bi-ca, readOnly: true}
                  resources:
                    requests: {cpu: "${ANALYSIS_CPU_REQUEST}", memory: "${ANALYSIS_MEMORY_REQUEST}"}
                    limits: {memory: "${ANALYSIS_MEMORY_LIMIT}"}
                  securityContext:
                    allowPrivilegeEscalation: false
                    capabilities: {drop: [ALL]}
              volumes:
                - {name: registry, configMap: {name: alerts-bi-registry}}
                - {name: ca-bundle, configMap: {name: alerts-bi-ca-bundle, optional: true}}

parameters:
  - name: ADMIN_IMAGE
    description: alerts-bi-admin image by digest, <registry>/<repository>@sha256:<64 hex>. One digest for the init container, UI, worker and CronJob.
    required: true
  - name: ADMIN_ROUTE_HOST
    description: Console host name. Empty lets OpenShift generate one; keep the existing host when upgrading.
    value: ""
  - name: ADMIN_ROUTE_TIMEOUT
    description: Router timeout for console requests; the synchronous POST /runs needs it long.
    value: 30m
  - name: WEEKLY_SCHEDULE
    description: Cron schedule of the weekly job, in UTC. It runs daily and only does weeks that are due.
    value: 30 2 * * *
  - name: WEEKLY_SUSPEND
    description: true keeps the weekly CronJob suspended. Set false only in the README step that enables it.
    value: "true"
  - name: IMAGE_PULL_SECRET
    description: Pull secret for ADMIN_IMAGE. If no such Secret exists, pods pull without credentials.
    value: alerts-bi-pull
  - name: UI_CPU_REQUEST
    description: CPU request of the admin and migrate containers.
    value: 100m
  - name: UI_MEMORY_REQUEST
    description: Memory request of the admin and migrate containers.
    value: 256Mi
  - name: UI_MEMORY_LIMIT
    description: Memory limit of the admin and migrate containers.
    value: 1Gi
  - name: ANALYSIS_CPU_REQUEST
    description: CPU request of the run-worker container, the weekly job and one-off admin jobs.
    value: 250m
  - name: ANALYSIS_MEMORY_REQUEST
    description: Memory request of the weekly job and one-off admin jobs.
    value: 512Mi
  - name: ANALYSIS_MEMORY_LIMIT
    description: Memory limit of the weekly job and one-off admin jobs (233 MiB peak measured for 1.2 million events / 20,000 identities).
    value: 2Gi
  - name: WORKER_MEMORY_REQUEST
    description: Memory request of the run-worker container.
    value: 512Mi
  - name: WORKER_MEMORY_LIMIT
    description: Memory limit of the run-worker container. Each job it runs at once (WORKER_CONCURRENCY) holds a week of alerts, so raise it with that setting.
    value: 2Gi
