# Fluent Bit for Alerts BI (design "Log shipping to Elasticsearch").
#
# The admin console, run worker, weekly CronJob, one-off jobs and the portal POST their log
# records as JSON to http://alerts-bi-logs:9880/<stream>, where <stream> is runs, admin or
# portal. The URL path becomes the record's tag, and each tag is written to its own
# Elasticsearch data stream: <prefix>-runs, <prefix>-admin and <prefix>-portal. Any other path
# matches no output and is dropped. The Elasticsearch owner defines the three data streams
# (index templates, rollover by date, retention) before the collector first writes; without a
# matching template Elasticsearch would create a plain index of that name instead.
#
# Install it as the ConfigMap alerts-bi-logs-config (deploy/openshift/README.md, "Ship logs to
# Elasticsearch"). Every ${...} value comes from the alerts-bi-logs Deployment's environment:
# the Secret alerts-bi-logs-es (host, port, user, password) and the logging.yaml parameters.

[SERVICE]
    Flush                     1
    Log_Level                 info
    # Health and metrics for the probes and for checking delivery:
    # /api/v1/health and /api/v1/metrics on port 2020.
    HTTP_Server               On
    HTTP_Listen               0.0.0.0
    HTTP_Port                 2020
    Health_Check              On
    # Records wait on disk while Elasticsearch is slow or down.
    storage.path              /var/lib/fluent-bit/buffer
    storage.sync              normal
    storage.backlog.mem_limit 16M
    # Retries back off to at most 15 minutes apart. After LOGS_RETRY_LIMIT tries (the default
    # 60 spans roughly eight hours) a chunk is dropped: a long outage, or records that
    # Elasticsearch keeps refusing, must not hold the buffer forever.
    scheduler.base            5
    scheduler.cap             900

[INPUT]
    Name              http
    Listen            0.0.0.0
    Port              9880
    storage.type      filesystem
    Mem_Buf_Limit     32M
    Buffer_Max_Size   8M
    Buffer_Chunk_Size 512K

[OUTPUT]
    Name                     es
    Match                    runs
    Host                     ${LOGS_ES_HOST}
    Port                     ${LOGS_ES_PORT}
    HTTP_User                ${LOGS_ES_USER}
    HTTP_Passwd              ${LOGS_ES_PASSWORD}
    tls                      ${LOGS_ES_TLS}
    tls.verify               ${LOGS_ES_TLS_VERIFY}
    tls.ca_file              ${LOGS_ES_CA_FILE}
    Index                    ${LOGS_INDEX_PREFIX}-runs
    # A data stream accepts only create.
    Write_Operation          create
    # The records carry their own @timestamp, which the data stream requires; Fluent Bit's
    # arrival time goes to received_at.
    Time_Key                 received_at
    # A retried chunk writes the same document ids, so a retry does not duplicate records
    # within one backing index. A chunk still being retried when the data stream rolls over
    # can store its records again in the new backing index.
    Generate_ID              On
    Suppress_Type_Name       On
    Trace_Error              On
    Buffer_Size              False
    Retry_Limit              ${LOGS_RETRY_LIMIT}
    storage.total_limit_size ${LOGS_BUFFER_LIMIT}

[OUTPUT]
    Name                     es
    Match                    admin
    Host                     ${LOGS_ES_HOST}
    Port                     ${LOGS_ES_PORT}
    HTTP_User                ${LOGS_ES_USER}
    HTTP_Passwd              ${LOGS_ES_PASSWORD}
    tls                      ${LOGS_ES_TLS}
    tls.verify               ${LOGS_ES_TLS_VERIFY}
    tls.ca_file              ${LOGS_ES_CA_FILE}
    Index                    ${LOGS_INDEX_PREFIX}-admin
    Write_Operation          create
    Time_Key                 received_at
    Generate_ID              On
    Suppress_Type_Name       On
    Trace_Error              On
    Buffer_Size              False
    Retry_Limit              ${LOGS_RETRY_LIMIT}
    storage.total_limit_size ${LOGS_BUFFER_LIMIT}

[OUTPUT]
    Name                     es
    Match                    portal
    Host                     ${LOGS_ES_HOST}
    Port                     ${LOGS_ES_PORT}
    HTTP_User                ${LOGS_ES_USER}
    HTTP_Passwd              ${LOGS_ES_PASSWORD}
    tls                      ${LOGS_ES_TLS}
    tls.verify               ${LOGS_ES_TLS_VERIFY}
    tls.ca_file              ${LOGS_ES_CA_FILE}
    Index                    ${LOGS_INDEX_PREFIX}-portal
    Write_Operation          create
    Time_Key                 received_at
    Generate_ID              On
    Suppress_Type_Name       On
    Trace_Error              On
    Buffer_Size              False
    Retry_Limit              ${LOGS_RETRY_LIMIT}
    storage.total_limit_size ${LOGS_BUFFER_LIMIT}
